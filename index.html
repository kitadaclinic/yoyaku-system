<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  
  <meta property="og:title" content="北田内科クリニック 予約システム">
  <meta property="og:description" content="オンラインで受取予約が可能です。">
  <meta property="og:image" content="ktd-icon1.png">
  <meta property="og:type" content="website">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="北田予約">
  <meta name="theme-color" content="#001f3f"> 
  
  <link rel="apple-touch-icon-precomposed" href="ktd-icon1.png">
  <link rel="icon" type="image/png" href="ktd-icon1.png">

  <title>北田内科クリニック 予約システム</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; overflow-x: hidden; overflow-y: auto;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #001f3f 0%, #003366 100%);
  font-size: 18px; -webkit-text-size-adjust: 100%; touch-action: pan-y;
  background-image: url("自由診療ロゴ.png");
  background-size: contain; background-repeat: no-repeat;
  background-position: top center; background-attachment: fixed;
}
@media (min-width: 769px) { html, body { background-size: 20% 190px; } }
.hero { height: 230px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 0 10px; }
.hero h1 { margin: 0; font-size: 28px; font-weight: 800; }
.hero h2 { margin-top: 8px; font-size: 20px; font-weight: 700; }
.container { max-width: 420px; width: 94%; margin: -35px auto 40px auto; background: white; border-radius: 14px; padding: 25px 20px 35px 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.25); }
label { display: block; margin-top: 20px; font-size: 18px; font-weight: 700; }
input, select { width: 100%; padding: 16px; margin-top: 8px; font-size: 18px; font-weight: 600; border-radius: 10px; border: 1.5px solid #bbb; background: white; display: block; -webkit-appearance: none; }
#dateGuide { margin-top: 6px; font-size: 15px; font-weight: 700; min-height: 20px; color: #555; }
.error-text { color: #dc3545 !important; animation: shake 0.3s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.time-buttons { display: flex; gap: 10px; margin-top: 10px; }
.time-buttons button { flex: 1; padding: 16px; min-height: 50px; font-size: 18px; font-weight: 700; border-radius: 10px; border: none; background: #e9ecef; cursor: pointer; }
.active { background: #007bff !important; color: white; }
.disabled { opacity: 0.3; pointer-events: none; background: #ddd !important; }
#submitBtn { width: 100%; padding: 18px; margin-top: 30px; font-size: 19px; font-weight: 800; border-radius: 12px; border: none; background: #c9c9c9; color: white; cursor: pointer; min-height: 56px; }
.hidden { display: none; }
.complete { text-align: center; padding: 40px 10px; word-break: break-word; overflow-wrap: break-word; }
#agreeCheck { width: 26px; height: 26px; -webkit-appearance: checkbox; }
button:disabled { background: #bfc4c9; cursor: not-allowed; }
.locked { background: #6c757d !important; }
@media(max-width:600px){ .container { width: 95%; max-width: 100%; margin-top: -20px; border-radius: 12px; padding: 22px 16px 30px 16px; } }
</style>
</head>
<body>
<div class="hero"><h1>Medical Smart Order</h1><h2>北田内科クリニック</h2></div>
<div class="container">
  <div id="loginArea">
    <label>パスワード</label><input type="password" id="password">
    <button id="loginBtn" onclick="login()" style="margin-top:15px;padding:16px;width:100%;font-size:18px;font-weight:700;border-radius:10px;border:none;background:#c9c9c9;color:white;min-height:50px;" disabled>ログイン</button>
  </div>
  <div id="formArea" class="hidden">
    <form id="reservationForm">
      <label>紹介コード（例：a123）</label><input type="text" id="referralCode" required>
      <label>姓</label><input type="text" id="lastName" required><label>名</label><input type="text" id="firstName" required>
      <label>セイ</label><input type="text" id="lastKana" required><label>メイ</label><input type="text" id="firstKana" required>
      <label>生年月日（18歳未満：不可）</label><input type="date" id="birthDate" required>
      <label>住所</label><input type="text" id="address" required>
      <label>電話番号</label><input type="tel" id="phone" required>
      <label>メールアドレス</label><input type="email" id="email" required>
      <label>初回購入</label><select id="firstPurchase" required><option value="">選択してください</option><option value="true">はい</option><option value="false">いいえ</option></select>
      <label>セット数（2.5mg）</label><select id="setCount"></select>
      <label>受取日（本日から4営業日以降）</label><input type="date" id="reservationDate" required><div id="dateGuide"></div>
      <label>時間帯</label><div class="time-buttons"><button type="button" id="morningBtn">午前</button><button type="button" id="afternoonBtn">午後</button></div>
      <div id="importantNotice" style="margin-top:22px;font-size:17px;line-height:1.7;">◆ マンジャロ処方前の重要確認...（略）</div>
      <div style="margin-top:15px;display:flex;align-items:center;gap:10px;"><input type="checkbox" id="agreeCheck"><label for="agreeCheck" style="margin:0;font-size:18px;font-weight:700;">上記内容を確認・同意しました</label></div>
      <div id="validationMessage" style="color: #dc3545; font-size: 15px; font-weight: 700; margin-top: 15px; text-align: center; min-height: 24px;"></div>
      <button type="submit" id="submitBtn" disabled>予約する</button>
    </form>
  </div>
  <div id="completeArea" class="complete hidden"></div>
</div>

<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbyZAVbcHORZuuavQsm9rkoARndvwtXX-hUQqUK5vIUJNB3oKg7vv9xE13bEw4RCKo05/exec";
let holidays=[]; let minDateStr=""; let selectedTime="";

window.onload = function() {
  post("getInitialCalendarData",{}).then(data=>{
    holidays = data.holidays; minDateStr = data.minDate;
    reservationDate.min = minDateStr; updateDateGuide(false);
  });
};

password.addEventListener("input", function(){
  const hasVal = this.value.trim() !== "";
  loginBtn.disabled = !hasVal;
  loginBtn.style.background = hasVal ? "#007bff" : "#c9c9c9";
});

function post(action,data){
  return fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:action,...data})}).then(r=>r.json());
}

function login(){
  loginBtn.disabled=true;
  post("authenticate",{password:password.value}).then(res=>{
    if(res===true){ loginArea.classList.add("hidden"); formArea.classList.remove("hidden"); if(minDateStr) reservationDate.min = minDateStr; initData(); }
    else{ alert("パスワードが違います"); loginBtn.disabled=false; }
  });
}

function initData(){
  post("getSetOptions",{}).then(list=>{
    setCount.innerHTML="";
    list.forEach(opt=>{ const o=document.createElement("option"); o.value=opt.value; o.textContent=opt.label; setCount.appendChild(o); });
  });
}

function finalValidateAge() {
  const val = birthDate.value; if(!val) return false;
  const today = new Date(); const birth = new Date(val.replace(/-/g, "/"));
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if(m < 0 || (m === 0 && today.getDate() < birth.getDate())){ age--; }
  if(age < 18){ alert("18歳未満は申し込みできません"); return false; }
  return true;
}

function updateDateGuide(isError) {
  if(!minDateStr) return;
  const dLimit = new Date(minDateStr.replace(/-/g, "/"));
  dateGuide.textContent = (dLimit.getMonth() + 1) + "月" + dLimit.getDate() + "日 以降を選択してください";
  if(isError) dateGuide.classList.add("error-text"); else dateGuide.classList.remove("error-text");
}

function checkFormComplete(){
  const dateVal = reservationDate.value;
  const isDateFilled = !!dateVal;
  const isTimeFilled = !!selectedTime;
  const isAgreed = agreeCheck.checked;
  const isBasicFilled = (referralCode.value && lastName.value && firstName.value && lastKana.value && firstKana.value && birthDate.value && address.value && phone.value && email.value && firstPurchase.value && setCount.value);

  let isHolidayOrSunday = false;
  if (dateVal) {
    const d = new Date(dateVal.replace(/-/g, "/"));
    if (d.getDay() === 0 || holidays.includes(dateVal)) isHolidayOrSunday = true;
  }

  const isDateLogicalError = (dateVal && minDateStr && dateVal < minDateStr);

  // 全項目OKの場合
  if(isBasicFilled && isDateFilled && !isDateLogicalError && !isHolidayOrSunday && isTimeFilled && isAgreed){
    submitBtn.disabled = false; submitBtn.style.background = "#007bff";
    validationMessage.textContent = ""; updateDateGuide(false);
    return;
  }

  // NGの場合のメッセージ制御
  submitBtn.disabled = true; submitBtn.style.background = "#c9c9c9";
  if(!isBasicFilled){ validationMessage.textContent = "※未入力の項目があります"; updateDateGuide(false); }
  else if(!isDateFilled){ validationMessage.textContent = "※受取日を選択してください"; updateDateGuide(false); }
  else if(isDateLogicalError || isHolidayOrSunday){
    validationMessage.textContent = isHolidayOrSunday ? "※日曜日・祝日は休診日です" : "※受取日を正しく選択してください";
    updateDateGuide(true);
  } else if(!isTimeFilled){ validationMessage.textContent = "※時間帯を選択してください"; updateDateGuide(false); }
  else if(!isAgreed){ validationMessage.textContent = "※同意チェックが必要です"; updateDateGuide(false); }
}

reservationDate.addEventListener("change", function(){
  const val = this.value; if(!val) return;
  const d = new Date(val.replace(/-/g, "/"));
  if(d.getDay() === 3 || d.getDay() === 6){
    afternoonBtn.classList.add("disabled");
    if(selectedTime === "午後"){ selectedTime = ""; afternoonBtn.classList.remove("active"); }
  } else { afternoonBtn.classList.remove("disabled"); }
  checkFormComplete();
});

morningBtn.onclick=function(){ selectedTime="午前"; morningBtn.classList.add("active"); afternoonBtn.classList.remove("active"); checkFormComplete(); };
afternoonBtn.onclick=function(){ if(afternoonBtn.classList.contains("disabled")) return; selectedTime="午後"; afternoonBtn.classList.add("active"); morningBtn.classList.remove("active"); checkFormComplete(); };

[referralCode,lastName,firstName,lastKana,firstKana,address,phone,email,firstPurchase,setCount,agreeCheck,birthDate].forEach(el=>{
  const ev = (el.tagName === "INPUT" && el.type !== "date" && el.type !== "checkbox") ? "input" : "change";
  el.addEventListener(ev, checkFormComplete);
});

reservationForm.addEventListener("submit",function(e){
  e.preventDefault(); if(!finalValidateAge()) return;
  submitBtn.disabled=true; submitBtn.classList.add("locked");
  validationMessage.textContent = "送信中です...";
  const data={
    referralCode:referralCode.value, lastName:lastName.value, firstName:firstName.value, lastKana:lastKana.value, firstKana:firstKana.value,
    birthDate:birthDate.value, address:address.value, phone:phone.value, email:email.value,
    firstPurchase:firstPurchase.value==="true", setCount:setCount.value, reservationDate:reservationDate.value, time:selectedTime
  };
  post("submitReservation",{data:data}).then(res=>{
    if(res.status==="success"){
      formArea.classList.add("hidden"); completeArea.classList.remove("hidden");
      completeArea.innerHTML="<h3>予約完了</h3><p>予約番号："+res.reservationNumber+"</p><p>メールを確認してください</p><button onclick=\"window.location.href='https://www.kitadaclinic.com/'\" style=\"margin-top:20px;padding:16px;width:100%;font-size:18px;font-weight:700;border-radius:10px;border:none;background:#007bff;color:white;\">HPへ</button>";
    } else { alert(res.message); submitBtn.disabled=false; submitBtn.classList.remove("locked"); checkFormComplete(); }
  });
});
</script>
</body>
</html>
