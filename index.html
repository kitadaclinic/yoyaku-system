<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  
  <!-- 【追加】LINE・メール配布用のプレビュー設定 (OGP) -->
  <meta property="og:title" content="北田内科クリニック 予約システム">
  <meta property="og:description" content="オンラインで受取予約が可能です。">
  <meta property="og:image" content="自由診療ロゴ.png">
  <meta property="og:type" content="website">
  
  <!-- 【追加】ホーム画面用アイコン設定 (Webクリップ) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="北田予約">
  <link rel="apple-touch-icon" href="自由診療ロゴ.png">

  <title>北田内科クリニック 予約システム</title>
<style>
/* iPhoneでの幅突き抜けを物理的に防止 */
*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f4f6f9;
  font-size: 18px;
  -webkit-text-size-adjust: 100%;
  touch-action: pan-y;

  background-image: url("自由診療ロゴ.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: top center;
}

@media (min-width: 769px) {
  html, body {
    background-size: 20% 190px;
  }
}

.hero {
  height: 230px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
  padding: 0 10px;
}
.hero h1 { margin: 0; font-size: 28px; font-weight: 800; }
.hero h2 { margin-top: 8px; font-size: 20px; font-weight: 700; }

.container {
  max-width: 420px;
  width: 94%;
  margin: -35px auto 40px auto;
  background: white;
  border-radius: 14px;
  padding: 25px 20px 35px 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

label { display: block; margin-top: 20px; font-size: 18px; font-weight: 700; }

input, select {
  width: 100%;
  padding: 16px;
  margin-top: 8px;
  font-size: 18px;
  font-weight: 600;
  border-radius: 10px;
  border: 1.5px solid #bbb;
  background: white;
  display: block;
  -webkit-appearance: none;
}

#dateGuide {
  margin-top: 6px;
  font-size: 15px;
  font-weight: 700;
  min-height: 20px;
  color: #555;
}
.error-text { color: #dc3545 !important; animation: shake 0.3s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.time-buttons { display: flex; gap: 10px; margin-top: 10px; }
.time-buttons button {
  flex: 1;
  padding: 16px;
  min-height: 50px;
  font-size: 18px;
  font-weight: 700;
  border-radius: 10px;
  border: none;
  background: #e9ecef;
  cursor: pointer;
}
.active { background: #007bff !important; color: white; }
.disabled { opacity: 0.3; pointer-events: none; background: #ddd !important; }

#submitBtn {
  width: 100%;
  padding: 18px;
  margin-top: 30px;
  font-size: 19px;
  font-weight: 800;
  border-radius: 12px;
  border: none;
  background: #c9c9c9;
  color: white;
  cursor: pointer;
  min-height: 56px;
}

.hidden { display: none; }
.complete { text-align: center; padding: 40px 10px; word-break: break-word; overflow-wrap: break-word; }
#agreeCheck { width: 26px; height: 26px; -webkit-appearance: checkbox; }

button:disabled { background: #bfc4c9; cursor: not-allowed; }
.locked { background: #6c757d !important; }

@media(max-width:600px){
  .container { width: 95%; max-width: 100%; margin-top: -20px; border-radius: 12px; padding: 22px 16px 30px 16px; }
}
</style>
</head>
<body>
<div class="hero">
  <h1>Medical Smart Order</h1>
  <h2>北田内科クリニック</h2>
</div>

<div class="container">
  <div id="loginArea">
    <label>パスワード</label>
    <input type="password" id="password">
    <button id="loginBtn" onclick="login()" style="margin-top:15px;padding:16px;width:100%;font-size:18px;font-weight:700;border-radius:10px;border:none;background:#c9c9c9;color:white;min-height:50px;" disabled>ログイン</button>
  </div>

  <div id="formArea" class="hidden">
    <form id="reservationForm">
      <label>紹介コード（例：a123）</label><input type="text" id="referralCode" required>
      <label>姓</label><input type="text" id="lastName" required>
      <label>名</label><input type="text" id="firstName" required>
      <label>セイ</label><input type="text" id="lastKana" required>
      <label>メイ</label><input type="text" id="firstKana" required>
      <label>生年月日（18歳未満：購入不可）</label><input type="date" id="birthDate" required>
      <label>住所（例：岐阜市神田町１－１）</label><input type="text" id="address" required>
      <label>電話番号（例：09012345678）</label><input type="tel" id="phone" required>
      <label>メールアドレス（確認メール受信用）</label><input type="email" id="email" required>
      <label>初回購入</label>
      <select id="firstPurchase" required>
        <option value="">選択してください</option>
        <option value="true">はい</option>
        <option value="false">いいえ</option>
      </select>
      <label>セット数（2.5mg）※初診料含みます</label><select id="setCount"></select>
      
      <label>受取日（本日から4営業日以降）</label>
      <input type="date" id="reservationDate" required>
      <div id="dateGuide"></div>

      <label>時間帯（診療時間内）</label>
      <div class="time-buttons">
        <button type="button" id="morningBtn">午前</button>
        <button type="button" id="afternoonBtn">午後</button>
      </div>

      <div id="importantNotice" style="margin-top:22px;font-size:17px;line-height:1.7;">
        ◆ マンジャロ処方前の重要確認<br>
        〖 慎重な判断が必要な方 〗<br>
        膵炎、甲状腺疾患（家族歴含む）、腎・肝機能障害、重度の低血糖、GLP-1薬の副作用歴、激しい胃腸障害がある方、および糖尿病薬を使用中の方。<br> 
        〖 重 要 事 項 〗<br> 
        • 登録は購入確定ではなく、医師の対面診察が必須です。<br> 
        • 医学的判断により処方不可となる場合があります。<br> 
        • 自己判断での使用・増量は重大な健康被害を招くため厳禁です。専門医の管理のもと、安全に使用してください。
      </div>

      <div style="margin-top:15px;display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="agreeCheck">
        <label for="agreeCheck" style="margin:0;font-size:18px;font-weight:700;">上記内容を確認・同意しました</label>
      </div>

      <div id="validationMessage" style="color: #dc3545; font-size: 15px; font-weight: 700; margin-top: 15px; text-align: center; min-height: 24px;"></div>

      <button type="submit" id="submitBtn" disabled>予約する</button>
    </form>
  </div>

  <div id="completeArea" class="complete hidden"></div>
</div>

<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbyZAVbcHORZuuavQsm9rkoARndvwtXX-hUQqUK5vIUJNB3oKg7vv9xE13bEw4RCKo05/exec";
let holidays=[];
let minDateStr="";
let selectedTime="";

window.onload = function() {
  post("getInitialCalendarData",{}).then(data=>{
    holidays = data.holidays;
    minDateStr = data.minDate;
    reservationDate.min = minDateStr;
    updateDateGuide(false);
  });
};

password.addEventListener("input", function(){
  if(this.value.trim() !== ""){
    loginBtn.disabled = false;
    loginBtn.style.background = "#007bff";
  } else {
    loginBtn.disabled = true;
    loginBtn.style.background = "#c9c9c9";
  }
});

function post(action,data){
  return fetch(GAS_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain"},
    body:JSON.stringify({action:action,...data})
  }).then(r=>r.json());
}

function login(){
  loginBtn.disabled=true;
  post("authenticate",{password:password.value})
  .then(res=>{
    if(res===true){
      loginArea.classList.add("hidden");
      formArea.classList.remove("hidden");
      if(minDateStr) reservationDate.min = minDateStr;
      initData();
    }else{
      alert("パスワードが違います");
      loginBtn.disabled=false;
    }
  });
}

function initData(){
  post("getSetOptions",{}).then(list=>{
    setCount.innerHTML="";
    list.forEach(function(opt){
      const o=document.createElement("option");
      o.value=opt.value;
      o.textContent=opt.label;
      setCount.appendChild(o);
    });
  });
}

function finalValidateAge() {
  const val = birthDate.value;
  if(!val) return false;
  const today = new Date();
  const birth = new Date(val.replace(/-/g, "/"));
  if(isNaN(birth.getTime())) return false;
  
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if(m < 0 || (m === 0 && today.getDate() < birth.getDate())){ age--; }

  if(age < 18){
    alert("18歳未満は申し込みできません");
    return false;
  }
  return true;
}

function updateDateGuide(isError) {
  if(!minDateStr) return;
  const dLimit = new Date(minDateStr.replace(/-/g, "/"));
  const formattedLimit = (dLimit.getMonth() + 1) + "月" + dLimit.getDate() + "日";
  dateGuide.textContent = formattedLimit + " 以降の日付を選択してください";
  
  if(isError) {
    dateGuide.classList.add("error-text");
  } else {
    dateGuide.classList.remove("error-text");
  }
}

function checkFormComplete(){
  const dateVal = reservationDate.value;
  const isDateFilled = !!dateVal;
  const isTimeFilled = !!selectedTime;
  const isAgreed = agreeCheck.checked;
  const isBasicFilled = (referralCode.value && lastName.value && firstName.value && lastKana.value && 
                        firstKana.value && birthDate.value && address.value && phone.value && 
                        email.value && firstPurchase.value && setCount.value);

  let isDateLogicalError = false;
  if(dateVal && minDateStr && dateVal < minDateStr){
    isDateLogicalError = true;
  }

  if(isBasicFilled && isDateFilled && !isDateLogicalError && isTimeFilled && isAgreed){
    submitBtn.disabled = false;
    submitBtn.style.background = "#007bff";
    validationMessage.textContent = "";
    updateDateGuide(false);
    return;
  }

  submitBtn.disabled = true;
  submitBtn.style.background = "#c9c9c9";

  if(!isBasicFilled){
    validationMessage.textContent = "※未入力の項目があります";
  } else if(!isDateFilled || isDateLogicalError){
    validationMessage.textContent = "※受取日を正しく選択してください";
    if(isDateLogicalError) updateDateGuide(true);
  } else if(!isTimeFilled){
    validationMessage.textContent = "※時間帯を選択してください";
  } else if(!isAgreed){
    validationMessage.textContent = "※重要事項への同意チェックが必要です";
  }
}

reservationDate.addEventListener("change", function(){
  const val = this.value;
  if(val && minDateStr && val < minDateStr){
    this.value = "";
    updateDateGuide(true);
  } else {
    updateDateGuide(false);
  }

  const d = new Date(val.replace(/-/g, "/"));
  if(d.getDay() === 3 || d.getDay() === 6){
    afternoonBtn.classList.add("disabled");
    if(selectedTime === "午後"){
      selectedTime = "";
      afternoonBtn.classList.remove("active");
    }
  } else {
    afternoonBtn.classList.remove("disabled");
  }
  
  checkFormComplete();
});

morningBtn.onclick=function(){
  selectedTime="午前";
  morningBtn.classList.add("active");
  afternoonBtn.classList.remove("active");
  checkFormComplete();
};

afternoonBtn.onclick=function(){
  if(afternoonBtn.classList.contains("disabled")) return;
  selectedTime="午後";
  afternoonBtn.classList.add("active");
  morningBtn.classList.remove("active");
  checkFormComplete();
};

[referralCode,lastName,firstName,lastKana,firstKana,address,phone,email,firstPurchase,setCount,agreeCheck,birthDate].forEach(el=>{
  const eventType = (el.tagName === "INPUT" && (el.type === "text" || el.type === "tel" || el.type === "email" || el.type === "password")) ? "input" : "change";
  el.addEventListener(eventType, checkFormComplete);
});

reservationForm.addEventListener("submit",function(e){
  e.preventDefault();
  if(!finalValidateAge()) return;

  submitBtn.disabled=true;
  submitBtn.classList.add("locked");
  validationMessage.textContent = "送信中です。しばらくお待ちください...";

  const data={
    referralCode:referralCode.value,
    lastName:lastName.value,
    firstName:firstName.value,
    lastKana:lastKana.value,
    firstKana:firstKana.value,
    birthDate:birthDate.value,
    address:address.value,
    phone:phone.value,
    email:email.value,
    firstPurchase:firstPurchase.value==="true",
    setCount:setCount.value,
    reservationDate:reservationDate.value,
    time:selectedTime
  };

  post("submitReservation",{data:data}).then(res=>{
    if(res.status==="success"){
      formArea.classList.add("hidden");
      completeArea.classList.remove("hidden");
      completeArea.innerHTML="<h3>予約が完了しました</h3><h5>★本画面のスクショを推奨★</h5><p>【 予約番号 】："+res.reservationNumber+"</p><p>予約内容確認メールをご指定のメールアドレスに送信致しました。（送信元：kitada.medical.clinic@gmail.com）<br>当日は確認メール、もしくは本画面に記載された【 予約番号 】を窓口でお知らせください</p><p>北田内科クリニック</p><button onclick=\"window.location.href='https://www.kitadaclinic.com/'\" style=\"margin-top:20px;padding:16px;width:100%;font-size:18px;font-weight:700;border-radius:10px;border:none;background:#007bff;color:white;min-height:50px;\">北田内科クリニック公式ホームページへ</button>";
    }else{
      alert(res.message);
      submitBtn.disabled=false;
      submitBtn.classList.remove("locked");
      checkFormComplete();
    }
  });
});
</script>
</body>
</html>
