<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>北田内科クリニック 予約システム</title>
<style>
/* 全要素にbox-sizingを適用し、iPhoneでの幅突き抜け（右端はみ出し）を防止 */
*, *::before, *::after {
  box-sizing: border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f4f6f9;
  font-size:18px;
  -webkit-text-size-adjust:100%;
  touch-action: pan-y;

  background-image: url("自由診療ロゴ.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: top center;
}
@media (min-width: 769px) {
  html,body{
    background-size: 20% 190px;
  }
}
img{max-width:100%;height:auto;display:block;}
.hero{background-size:cover;background-position:center;height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;text-align:center;padding:0 10px;}
.hero h1{margin:0;font-size:28px;font-weight:800;}
.hero h2{margin-top:8px;font-size:20px;font-weight:700;}
.container{max-width:420px;width:100%;margin:-35px auto 40px auto;background:white;border-radius:14px;padding:25px 20px 35px 20px;box-shadow:0 8px 25px rgba(0,0,0,0.08);}
label{display:block;margin-top:20px;font-size:18px;font-weight:700;}
/* inputの幅を100%に固定し、枠線を含めた計算に統一 */
input,select{width:100%;padding:16px;margin-top:8px;font-size:18px;font-weight:600;border-radius:10px;border:1.5px solid #bbb;background:white;display:block;}
.invalid-date{background:#ffe5e5;color:red;}
.time-buttons{display:flex;gap:10px;margin-top:10px;}
.time-buttons button{flex:1;padding:16px;min-height:50px;font-size:18px;font-weight:700;border-radius:10px;border:none;background:#e9ecef;cursor:pointer;}
.active{background:#007bff!important;color:white;}
.disabled{opacity:0.4;pointer-events:none;}
#submitBtn{width:100%;padding:18px;margin-top:30px;font-size:19px;font-weight:800;border-radius:12px;border:none;background:#0056d6;color:white;cursor:pointer;min-height:56px;}
.hidden{display:none;}
.complete{text-align:center;padding:40px 10px;word-break:break-word;overflow-wrap:break-word;}
#agreeCheck{width:26px;height:26px;}
button:disabled{background:#bfc4c9;cursor:not-allowed;}
.locked{background:#6c757d!important;}
@media(max-width:600px){.container{width:100%;max-width:100%;margin:0;border-radius:0;padding:22px 16px 30px 16px;}}
.btn-disabled{
background:#c9c9c9;
color:#666;
pointer-events:none;
}

.btn-ready{
background:#007bff;
color:white;
}

.btn-locked{
background:#555;
color:white;
pointer-events:none;
}
</style>
</head>
<body>
<div class="hero">
<h1>Medical Smart Order</h1>
<h2>北田内科クリニック</h2>
</div>
<div class="container">
<div id="loginArea">
<label>パスワード</label>
<input type="password" id="password">

<button id="loginBtn" onclick="login()" style="margin-top:15px;padding:16px;width:100%;font-size:18px;font-weight:700;border-radius:10px;border:none;background:#007bff;color:white;min-height:50px;" disabled>ログイン</button>
</div>
<div id="formArea" class="hidden">
<form id="reservationForm">

<label>紹介コード（例：a123）</label><input type="text" id="referralCode" required>

<label>姓</label><input type="text" id="lastName" required>
<label>名</label><input type="text" id="firstName" required>
<label>セイ</label><input type="text" id="lastKana" required>
<label>メイ</label><input type="text" id="firstKana" required>
<label>生年月日（18歳未満：購入不可）</label><input type="date" id="birthDate" required>
<label>住所（例：岐阜市神田町１－１）</label><input type="text" id="address" required>
<label>電話番号（例：09012345678）</label><input type="tel" id="phone" required>
<label>メールアドレス（確認メール受信用）</label><input type="email" id="email" required>
<label>初回購入</label>
<select id="firstPurchase" required>
<option value="">選択してください</option>
<option value="true">はい</option>
<option value="false">いいえ</option>
</select>
<label>セット数（2.5mg）※初診料含みます</label><select id="setCount"></select>
<label>受取日（本日から4営業日以降）</label><input type="date" id="reservationDate" required>
<label>時間帯（診療時間内）</label>
<div class="time-buttons">
<button type="button" id="morningBtn">午前</button>
<button type="button" id="afternoonBtn">午後</button>
</div>

<div id="importantNotice" style="margin-top:22px;font-size:17px;line-height:1.7;">
◆ マンジャロ処方前の重要確認<br>
〖 慎重な判断が必要な方 〗<br>
膵炎、甲状腺疾患（家族歴含む）、腎・肝機能障害、重度の低血糖、GLP-1薬の副作用歴、激しい胃腸障害がある方、および糖尿病薬を使用中の方。<br> 
〖 重 要 事 項 〗<br> 
• 登録は購入確定ではなく、医師の対面診察が必須です。<br> 
• 医学的判断により処方不可となる場合があります。<br> 
• 自己判断での使用・増量は重大な健康被害を招くため厳禁です。専門医の管理のもと、安全に使用してください。
</div>

<div style="margin-top:15px;display:flex;align-items:center;gap:10px;">
<input type="checkbox" id="agreeCheck">
<label for="agreeCheck" style="margin:0;font-size:18px;font-weight:700;">上記内容を確認・同意しました</label>
</div>

<!-- 未入力項目ガイドメッセージエリア -->
<div id="validationMessage" style="color: #dc3545; font-size: 15px; font-weight: 700; margin-top: 15px; text-align: center; min-height: 24px;"></div>

<button type="submit" id="submitBtn" disabled>予約する</button>
</form>
</div>
<div id="completeArea" class="complete hidden"></div>
</div>

<script>

const GAS_URL="https://script.google.com/macros/s/AKfycbyZAVbcHORZuuavQsm9rkoARndvwtXX-hUQqUK5vIUJNB3oKg7vv9xE13bEw4RCKo05/exec";

let holidays=[];
let minDate="";
let selectedTime="";

password.addEventListener("input",function(){
if(password.value.trim()!==""){
loginBtn.disabled=false;
}else{
loginBtn.disabled=true;
}
});

function post(action,data){
return fetch(GAS_URL,{
method:"POST",
headers:{"Content-Type":"text/plain"},
body:JSON.stringify({action:action,...data})
}).then(r=>r.json());
}

function login(){
loginBtn.disabled=true;

post("authenticate",{password:password.value})
.then(res=>{
if(res===true){
loginArea.classList.add("hidden");
formArea.classList.remove("hidden");
initData();
}else{
alert("パスワードが違います");
loginBtn.disabled=false;
}
});
}

function initData(){
post("getInitialCalendarData",{}).then(data=>{
holidays=data.holidays;
minDate=data.minDate;
reservationDate.setAttribute("min",minDate);
reservationDate.min = minDate;
});
post("getSetOptions",{}).then(list=>{
setCount.innerHTML="";
list.forEach(function(opt){
const o=document.createElement("option");
o.value=opt.value;
o.textContent=opt.label;
setCount.appendChild(o);
});
});
}

const requiredInputs=document.querySelectorAll("#reservationForm input[required],#reservationForm select[required]");

requiredInputs.forEach(function(el){
el.addEventListener("input",checkForm);
el.addEventListener("change",checkForm);
});

function checkForm(){
let filled=true;

requiredInputs.forEach(function(el){
if(!el.value){
filled=false;
}
});

if(!agreeCheck.checked){
filled=false;
}

if(!selectedTime){
filled=false;
}

submitBtn.disabled=!filled;
}

/**
 * 18歳未満チェック（最強対策版）
 * blur(離脱)時に加え、送信ボタン押下時にも再実行する
 */
function validateAge(inputElement) {
  if(!inputElement.value) return true;
  const today=new Date();
  const birth=new Date(inputElement.value.replace(/-/g, "/"));
  if(isNaN(birth.getTime())) return true;
  
  // 未来の日付や極端に古い日付はiPhoneの入力中誤作動とみなしスルー
  if(birth > today || birth.getFullYear() < 1900) return true;

  let age=today.getFullYear()-birth.getFullYear();
  const m=today.getMonth()-birth.getMonth();
  if(m<0 || (m===0 && today.getDate()<birth.getDate())){ age--; }

  if(age<18){
    alert("18歳未満は申し込みできません");
    inputElement.value="";
    return false;
  }
  return true;
}

birthDate.addEventListener("blur", function(){
  validateAge(this);
  checkFormComplete();
});

/**
 * 受取日チェック（最強対策版）
 * 4営業日ルール、日曜、祝日を徹底判定
 */
function validateReservationDate(inputElement) {
  if(!inputElement.value) return true;
  const d=new Date(inputElement.value.replace(/-/g, "/"));
  const day=d.getDay();
  const selectedDate = inputElement.value;

  if(selectedDate < minDate){
    alert("4営業日以降の日付を選択してください");
    inputElement.value="";
    return false;
  }
  if(day===0){
    alert("日曜日は選択できません");
    inputElement.value="";
    return false;
  }
  if(holidays.includes(selectedDate)){
    alert("祝日は選択できません");
    inputElement.value="";
    return false;
  }
  return true;
}

reservationDate.addEventListener("change",function(){
  if(!validateReservationDate(this)) {
    this.classList.add("invalid-date");
    return;
  }
  this.classList.remove("invalid-date");
  const d=new Date(this.value.replace(/-/g, "/"));
  if(d.getDay()===3 || d.getDay()===6){
    afternoonBtn.classList.add("disabled");
  }else{
    afternoonBtn.classList.remove("disabled");
  }
  checkFormComplete();
});

morningBtn.onclick=function(){
selectedTime="午前";
morningBtn.classList.add("active");
afternoonBtn.classList.remove("active");
checkForm();
checkFormComplete();
};

afternoonBtn.onclick=function(){
if(afternoonBtn.classList.contains("disabled")){
alert("この日は午後を選択できません");
return;
}
selectedTime="午後";
afternoonBtn.classList.add("active");
morningBtn.classList.remove("active");
checkForm();
checkFormComplete();
};

reservationForm.addEventListener("submit",function(e){
e.preventDefault();

// --- 送信前の二段構えチェック ---
if(!validateAge(birthDate)) return;
if(!validateReservationDate(reservationDate)) return;

submitBtn.disabled=true;
submitBtn.classList.add("locked");

if(!selectedTime){
alert("時間帯を選択してください");
submitBtn.disabled=false;
submitBtn.classList.remove("locked");
return;
}

if(!agreeCheck.checked){
alert("上記内容を確認・同意してください");
submitBtn.disabled=false;
submitBtn.classList.remove("locked");
return;
}

const data={
referralCode:referralCode.value,
lastName:lastName.value,
firstName:firstName.value,
lastKana:lastKana.value,
firstKana:firstKana.value,
birthDate:birthDate.value,
address:address.value,
phone:phone.value,
email:email.value,
firstPurchase:firstPurchase.value==="true",
setCount:setCount.value,
reservationDate:reservationDate.value,
time:selectedTime
};

post("submitReservation",{data:data}).then(res=>{
if(res.status==="success"){
formArea.classList.add("hidden");
completeArea.classList.remove("hidden");
completeArea.innerHTML="<h3>予約が完了しました</h3><h5>★本画面のスクショを推奨★</h5><p>【 予約番号 】："+res.reservationNumber+"</p><p>予約内容確認メールをご指定のメールアドレスに送信致しました。（送信元：kitada.medical.clinic@gmail.com）<br>当日は確認メール、もしくは本画面に記載された【 予約番号 】を窓口でお知らせください</p><p>北田内科クリニック</p><button onclick=\"window.location.href='https://www.kitadaclinic.com/'\" style=\"margin-top:20px;padding:16px;width:100%;font-size:18px;font-weight:700;border-radius:10px;border:none;background:#007bff;color:white;min-height:50px;\">北田内科クリニック公式ホームページへ</button>";
}else{
alert(res.message);
submitBtn.disabled=false;
submitBtn.classList.remove("locked");
}
});

});

/* ===== 入力ガイドメッセージ制御ロジック ===== */
const loginBtnElement = document.getElementById("loginBtn");
const submitBtnElement = document.getElementById("submitBtn");
const msgArea = document.getElementById("validationMessage");

// ログインボタンの初期スタイル
if(loginBtnElement){
  loginBtnElement.style.background="#c9c9c9";
}

function checkFormComplete(){
  let message = "";
  if(!referralCode.value){
    message = "※紹介コードを入力してください";
  } else if(!lastName.value || !firstName.value || !lastKana.value || !firstKana.value){
    message = "※お名前（漢字・カナ）を入力してください";
  } else if(!birthDate.value){
    message = "※生年月日を入力してください";
  } else if(!address.value){
    message = "※住所を入力してください";
  } else if(!phone.value){
    message = "※電話番号を入力してください";
  } else if(!email.value){
    message = "※メールアドレスを入力してください";
  } else if(!firstPurchase.value){
    message = "※初回購入の有無を選択してください";
  } else if(!setCount.value){
    message = "※セット数を選択してください";
  } else if(!reservationDate.value){
    message = "※受取日を選択してください";
  } else if(!selectedTime){
    message = "※時間帯（午前・午後）を選択してください";
  } else if(!agreeCheck.checked){
    message = "※重要事項への同意チェックが必要です";
  }

  if(
    referralCode.value && lastName.value && firstName.value && lastKana.value &&
    firstKana.value && birthDate.value && address.value && phone.value &&
    email.value && firstPurchase.value && setCount.value && reservationDate.value &&
    selectedTime && agreeCheck.checked
  ){
    submitBtnElement.disabled=false;
    submitBtnElement.style.background="#007bff";
    msgArea.textContent = "";
  }else{
    submitBtnElement.disabled=true;
    submitBtnElement.style.background="#c9c9c9";
    msgArea.textContent = message;
  }
}

// 全ての必須項目に監視イベントを登録
[
referralCode,lastName,firstName,lastKana,firstKana,birthDate,address,phone,email,firstPurchase,setCount,reservationDate,agreeCheck
].forEach(el=>{
  el.addEventListener("change",checkFormComplete);
  el.addEventListener("input",checkFormComplete);
});

// 送信中表示
reservationForm.addEventListener("submit",function(){
  if(!submitBtnElement.disabled){
    msgArea.textContent = "送信中です。しばらくお待ちください...";
  }
});
</script>
</body>
</html>
